<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Rich Registration Form</title>

    <!-- EXTERNAL CSS: Best for site-wide styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        

        /* Marquee Styling */
        marquee {
            width: 100%;
            background: #ffffff;
            color: rgb(0, 0, 0);
            padding: 10px 0;
            font-weight: bold;
            margin-bottom: 20px;
        }

        form { 
            background: rgb(255, 255, 255);
            width: 100%;
            max-width: 500px; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .media-container {
            text-align: center;
            margin-bottom: 20px;
        }

        img {
            max-width: 100px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        video, audio {
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
        }

        div { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="password"], select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;
        }

        .btn-submit {
            width: 100%; background-color: #28a745; color: white; padding: 12px; 
            border: none; border-radius: 5px; font-size: 16px; cursor: pointer;
        }
        
        .footer-link {
            margin-top: 15px;
            display: block;
            text-align: center;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Marquee -->
    <marquee behavior="scroll" direction="left">
        Welcome to the Global Registration Portal! Please fill out all details accurately.
    </marquee>

    <form action="/submit" method="POST">


  <!-- Embedding a document or page inside the form -->
  <iframe src="https://share.google/smC2nsf4KvVRAgB4K" width="100%" height="200"></iframe>

  <button type="submit">Submit</button>

        
        <!-- Image (Profile Placeholder) -->
        <div class="media-container">
            <img src="d:\Anime Wallpaper\Captain Levi Ackerman.jpg" alt="Profile Icon">
            <h2>User Registration</h2>
        </div>

        <!-- Audio (Background or Instructions) -->
        <div>
            <label>Listen to Instructions:</label>
            <audio controls>
                <source src="your-audio-file.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Form Fields -->
        <div>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div>
            <label for="state">State</label>
            <select id="state" name="state">
                <option value="ca">California</option>
                <option value="ny">New York</option>
            </select>
        </div>

        <!-- Gender & Hobbies (Same as before) -->
        <div>
            <label>Gender:</label>
            <input type="radio" name="gender" value="m"> Male
            <input type="radio" name="gender" value="f"> Female
        </div>

        <div>
            <label>Hobbies:</label>
            <input type="checkbox" name="hobbies" value="coding"> Coding
            <input type="checkbox" name="hobbies" value="music"> Music
        </div>

        <!-- Video (Tutorial) -->
        <div>
            <label>Help Video:</label>
            <video controls poster="https://via.placeholder.com/500x200"> 
                <source src="https://share.google/r1OmGyTzUHhkfQN9U" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <button type="submit" class="btn-submit">Register Now</button>

        <!-- Hyperlink -->
        <a href="https://example.com/privacy" class="footer-link" target="_blank">
            Read our Privacy Policy
        </a>

    </form>

</body>
</html>
