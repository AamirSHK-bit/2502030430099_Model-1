<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested Lists Example</title>
    <style>
        body {
            font-family: sans-serif;
            line-height: 1.6;
            margin: 40px;
        }
        h2 {
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h2>Engineering </h2>
    <ol>
        <li><strong>Eng.degrees</strong>
            <!-- Nested Unordered List -->
            <ul>
                <li>CE</li>
                <li>IT</li>
                <li>CSE</li>
            </ul>
        </li>

        <li><strong>Work Streams</strong>
            <!-- Nested Ordered List -->
            <ol type="a">
                <li>Check emails</li>
                <li>Develop New Feature
                    <!-- Further Nesting -->
                    <ul>
                        <li>Write HTML structure</li>
                        <li>Apply CSS styling</li>
                    </ul>
                </li>
                <li>Team meeting at 11:00 AM</li>
            </ol>
        </li>

        <li><strong>Job Roles</strong>
            <ul>
                <li>Data Analyst</li>
                <li>Cyber security ADmin</li>
            </ul>
        </li>
    </ol>

</body>
</html>
