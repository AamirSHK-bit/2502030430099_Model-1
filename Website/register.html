<!DOCTYPE html>
<html lang="en">
<head>
    <title>StreamVault | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>StreamVault</h1>
        <nav><a href="index.html">Home</a></nav>
    </header>

    <form id="regForm">
        <h2>Create Account</h2>
        <input type="text" placeholder="Username" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" style="background: var(--accent); color: white; border: none; padding: 10px; width: 100%; cursor: pointer;">Start Streaming</button>
    </form>
</body>
</html>
